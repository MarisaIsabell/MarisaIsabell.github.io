  <main>
    <section>
      <h2>Publications</h2>
      <p>
        Publications are listed by year. DOI links point to the publication or preprint record.
      </p>
      <div id="publication-list">
        <p>Loading publications...</p>
      </div>
    </section>
  </main>

  <script>
  function formatAuthors(creators) {
    if (!creators) return "";

    return creators
      .filter(c => c.creatorType === "author")
      .map(c => `${c.lastName}, ${c.firstName?.[0] || ""}.`)
      .join(", ");
  }

  function getYear(date) {
    if (!date) return "n.d.";
    return date.substring(0, 4);
  }

  async function loadPublications() {
    const list = document.getElementById("publication-list");

    try {
      const response = await fetch("publications.json");
      const publications = await response.json();

      const normalized = publications.map(pub => ({
        year: getYear(pub.date),
        authors: formatAuthors(pub.creators),
        title: pub.title || "",
        journal: pub.publicationTitle || "Preprint",
        doi: pub.DOI || ""
      }));

      normalized.sort((a, b) => b.year.localeCompare(a.year));

      const grouped = normalized.reduce((acc, pub) => {
        if (!acc[pub.year]) acc[pub.year] = [];
        acc[pub.year].push(pub);
        return acc;
      }, {});

      list.innerHTML = "";

      Object.keys(grouped)
        .sort((a, b) => b.localeCompare(a))
        .forEach(year => {
          const yearGroup = document.createElement("div");
yearGroup.className = "publication-year-group";

const separator = document.createElement("div");
separator.className = "year-separator";

list.appendChild(separator);
list.appendChild(yearGroup);

        grouped[year].forEach(pub => {
  const row = document.createElement("div");
  row.className = "publication-row";

  const main = document.createElement("div");
  main.className = "publication-main";

  const yearEl = document.createElement("div");
  yearEl.className = "publication-year";
  yearEl.textContent = pub.year;

  const doiLink = pub.doi
    ? `<a href="https://doi.org/${pub.doi}" target="_blank" rel="noopener noreferrer">doi:${pub.doi}</a>`
    : "";

  main.innerHTML = `
    <span class="publication-authors">${pub.authors}</span>.
    <strong class="publication-title">${pub.title}</strong>.
    <em class="publication-journal">${pub.journal}</em>.
    ${doiLink}
  `;

  row.appendChild(main);
  row.appendChild(yearEl);
  yearGroup.appendChild(row);
});

            const doiLink = pub.doi
              ? `<a href/doi.org/${pub.doi}doi:${pub.doi}</a>`
              : "";

            item.innerHTML = `
              ${pub.authors}
              <strong>${pub.title}</strong>.
              <em>${pub.journal}</em>.
              ${doiLink}
            `;

            list.appendChild(item);
          });
        });

    } catch (error) {
      console.error(error);
      list.innerHTML = "<p>Publication list could not be loaded.</p>";
    }
  }

  loadPublications();
</script>
