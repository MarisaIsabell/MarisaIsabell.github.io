  <main>
    <section>
      <h2>Publications</h2>
      <p>
        Publications are listed by year. DOI links point to the publication or preprint record.
      </p>
      <div id="publication-list">
        <p>Loading publications...</p>
      </div>
    </section>
  </main>

  <script>
  // Parses CSL-JSON format (Zotero export): pub.author[].family/given, pub.issued["date-parts"]
  function formatAuthors(authors) {
    if (!authors || !authors.length) return "";
    return authors
      .map(a => {
        if (a.literal) return a.literal;
        const last = a.family || "";
        const first = a.given ? a.given[0] + "." : "";
        return first ? `${last}, ${first}` : last;
      })
      .join(", ");
  }

  function highlightName(authorsStr) {
    // Bold all variants of Marisa Keller's name (married) and Metzger (maiden)
    return authorsStr.replace(
      /((Keller|Metzger),\s+M(?:arisa(?:\s+Isabell)?(?:\s+I\.?)?|\s+I\.)?\.?)/g,
      "<strong>$1</strong>"
    );
  }

  function getYear(pub) {
    const parts = pub.issued?.["date-parts"]?.[0];
    if (parts && parts[0]) return String(parts[0]);
    return "n.d.";
  }

  function getJournal(pub) {
    return pub["container-title"] || pub.publisher || "Preprint";
  }

  async function loadPublications() {
    const list = document.getElementById("publication-list");

    try {
      const response = await fetch("publications.json");
      const publications = await response.json();

      const normalized = publications.map(pub => ({
        year: getYear(pub),
        authors: formatAuthors(pub.author),
        title: pub.title || "",
        journal: getJournal(pub),
        doi: pub.DOI || ""
      }));

      const grouped = normalized.reduce((acc, pub) => {
        if (!acc[pub.year]) acc[pub.year] = [];
        acc[pub.year].push(pub);
        return acc;
      }, {});

      list.innerHTML = "";

      Object.keys(grouped)
        .sort((a, b) => b.localeCompare(a))
        .forEach(year => {
          const yearGroup = document.createElement("div");
          yearGroup.className = "publication-year-group";

          const separator = document.createElement("div");
          separator.className = "year-separator";

          list.appendChild(separator);
          list.appendChild(yearGroup);

          grouped[year].forEach(pub => {
            const row = document.createElement("div");
            row.className = "publication-row";

            const main = document.createElement("div");
            main.className = "publication-main";

            const yearEl = document.createElement("div");
            yearEl.className = "publication-year";
            yearEl.textContent = pub.year;

            const doiLink = pub.doi
              ? `<a href="https://doi.org/${pub.doi}" target="_blank" rel="noopener noreferrer">doi:${pub.doi}</a>`
              : "";

            main.innerHTML = `
              <span class="publication-authors">${highlightName(pub.authors)}</span>.
              <strong class="publication-title">${pub.title}</strong>.
              <em class="publication-journal">${pub.journal}</em>.
              ${doiLink}
            `;

            row.appendChild(main);
            row.appendChild(yearEl);
            yearGroup.appendChild(row);
          });
        });

    } catch (error) {
      console.error(error);
      list.innerHTML = "<p>Publication list could not be loaded.</p>";
    }
  }

  loadPublications();
</script>
